spring.application.name=metalab
server.port=${PORT:8080}

# Banco (Supabase): valores vêm de variáveis de ambiente, nunca do código
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# O Liquibase cria e altera as tabelas; o Hibernate só confere se batem
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Verificação de saúde para o Render
management.endpoints.web.exposure.include=health

# Segredos do CPF: gere cada um com "openssl rand -base64 32" e guarde em lugar seguro.
# Se perder o CPF_PEPPER, não será mais possível reconhecer CPFs já cadastrados.
metalab.cpf.pepper=${CPF_PEPPER}
metalab.cpf.chave=${CPF_CHAVE}

# Cloudflare Turnstile (chave secreta, só no servidor)
metalab.captcha.secret=${TURNSTILE_SECRET}

# Sites que podem chamar a API, separados por vírgula
metalab.cors.origens=${CORS_ORIGENS:http://localhost:5173}

# Atrás do proxy do Render, usar o IP real do visitante
server.forward-headers-strategy=native

server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
metalab.admin.email=${ADMIN_EMAIL:}
metalab.admin.senha=${ADMIN_SENHA:}
metalab.admin.nome=${ADMIN_NOME:Administrador}